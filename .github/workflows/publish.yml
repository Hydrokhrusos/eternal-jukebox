name: Publish Eternal Jukebox

on:
    push:
        branches: ['main']
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Use Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20
            - name: Install dependencies
              run: npm install
            - name: Build
              run: npm run build-local
            - name: Copy release files
              run: |
                  cp README.md ./dist/README.md
                  cp preview.png ./dist/preview.png
                  cp seamless-helper.ts ./dist/seamless-helper.ts
                  cp start-seamless-helper.ps1 ./dist/start-seamless-helper.ps1
            - name: Deploy
              run: |
                  set -euo pipefail

                  deploy_dir="$(mktemp -d)"
                  cp -R ./dist/. "$deploy_dir/"

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git fetch origin dist || true
                  git clean -fdx

                  if git rev-parse --verify origin/dist >/dev/null 2>&1; then
                      git checkout -B dist origin/dist
                  else
                      git checkout --orphan dist
                  fi

                  git rm -r . >/dev/null 2>&1 || true
                  cp -R "$deploy_dir"/. .
                  git add -A
                  git commit -m "Build eternal-jukebox dist" || exit 0
                  git push origin dist
